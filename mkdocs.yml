site_name: Infra Notes
site_description: Practical notes on Linux, Networking, DevOps, Containers, Kubernetes and Cloud
site_url: https://prmctl.github.io/Infra-Notes/

repo_name: prmctl/Infra-Notes
repo_url: https://github.com/prmctl/Infra-Notes
edit_uri: edit/main/docs/

copyright: >
  Copyright &copy; 2026 Infra Notes

theme:
  name: material

  language: en

  logo: assets/logo.svg
  favicon: assets/favicon.png

  icon:
    repo: fontawesome/brands/github
    logo: material/server-network

  palette:
    # Dark theme - default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    # Light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes

    # Fast navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking

    # Search
    - search.suggest
    - search.highlight
    - search.share

    # Header
    - header.autohide

    # Code
    - content.code.copy
    - content.code.annotate

    # Content
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

plugins:
  - search

  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"

      archive: true
      archive_name: Archive

      categories: true
      categories_name: Categories

      pagination: true
      pagination_per_page: 10

      post_date_format: long
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"

  - tags

markdown_extensions:
  # Basic
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html

  # Table of contents
  - toc:
      permalink: true
      permalink_title: Anchor link to this section

  # Highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Details / expandable blocks
  - pymdownx.details

  # Keyboard keys
  - pymdownx.keys

  # Mark / insert / delete
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

  # Icons & emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prmctl
      name: GitHub

